<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF41" />
      <stop offset="50%" stop-color="#00D1FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00D1FF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#0A0B10" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#1E2330" stroke-width="8" />

  <!-- Outer Cyber Circuit Traces -->
  <path d="M 64 256 L 110 256 L 140 226" fill="none" stroke="#00FF41" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round" />
  <circle cx="64" cy="256" r="6" fill="#00FF41" fill-opacity="0.6" />
  
  <path d="M 448 256 L 402 256 L 372 226" fill="none" stroke="#00D1FF" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round" />
  <circle cx="448" cy="256" r="6" fill="#00D1FF" fill-opacity="0.6" />

  <path d="M 256 64 L 256 110" fill="none" stroke="#00FF41" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round" />
  <circle cx="256" cy="64" r="6" fill="#00FF41" fill-opacity="0.6" />

  <!-- Shield Body Fill -->
  <path d="M 256 96 C 340 96 384 128 384 192 C 384 320 288 392 256 416 C 224 392 128 320 128 192 C 128 128 172 96 256 96 Z"
        fill="url(#coreGrad)" />

  <!-- Shield Neon Contour -->
  <path d="M 256 96 C 340 96 384 128 384 192 C 384 320 288 392 256 416 C 224 392 128 320 128 192 C 128 128 172 96 256 96 Z"
        fill="none"
        stroke="url(#shieldGrad)"
        stroke-width="14"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#neonGlow)" />

  <!-- Inner Circuit Grid Lines -->
  <path d="M 216 170 L 296 170" fill="none" stroke="#00FF41" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 256 170 L 256 220" fill="none" stroke="#00FF41" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7" />
  
  <!-- Security Padlock / Core Crest -->
  <!-- Shackle -->
  <path d="M 226 230 C 226 210 240 196 256 196 C 272 196 286 210 286 230 L 286 244 L 226 244 Z" 
        fill="none" 
        stroke="#00FF41" 
        stroke-width="10" 
        stroke-linecap="round" />
  <!-- Lock Body -->
  <rect x="212" y="244" width="88" height="72" rx="14" fill="#0F172A" stroke="#00D1FF" stroke-width="8" />
  <!-- Keyhole -->
  <circle cx="256" cy="274" r="8" fill="#00FF41" />
  <path d="M 253 274 L 259 274 L 261 294 L 251 294 Z" fill="#00FF41" />

  <!-- Cyber Node Accents -->
  <circle cx="256" cy="356" r="6" fill="#00FF41" filter="url(#neonGlow)" />
  <circle cx="206" cy="336" r="4" fill="#00D1FF" />
  <circle cx="306" cy="336" r="4" fill="#00D1FF" />
</svg>
